name: FormeraIOS
options:
  bundleIdPrefix: com.formera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  FormeraIOS:
    type: application
    platform: iOS
    sources:
      - path: FormeraIOS/Sources
      - path: FormeraIOS/Resources
    info:
      path: FormeraIOS/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Formera
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formera.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  FormeraIOS:
    build:
      targets:
        FormeraIOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
